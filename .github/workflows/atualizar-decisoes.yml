name: Atualizar decisões CREA-MS

on:
  schedule:
    # Dia 5, às 08:00 no horário de Campo Grande (12:00 UTC).
    - cron: "0 12 5 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-decisoes-creams
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Atualizar base incremental
        run: python coletor.py
      - name: Salvar base atualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/documentos.csv.gz dados/fontes_anuais.csv
          if git diff --cached --quiet; then
            echo "Nenhuma alteração na base."
          else
            git commit -m "Atualização automática das decisões CREA-MS"
            git push
          fi
